<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Vintara Logistics</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,600;1,800&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="logo.png">
    
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-purple: #8A2BE2;
            --accent-red: #dd00ff;
            --border-light: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            /* Asegurar que las partículas no creen scrollbar */
            position: relative; 
        }

        /* --- PRELOADER (ESTÁNDAR) --- */
        #preloader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-primary);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loader-circle {
            width: 60px; height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--accent-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.3);
        }

        .loader-text {
            font-family: 'Kanit', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        .hide-loader { opacity: 0; visibility: hidden; pointer-events: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* --- HEADER --- */
        header {
            position: fixed; top: 0; width: 100%; padding: 1.5rem 5%;
            display: flex; justify-content: space-between; align-items: center; z-index: 100;
            backdrop-filter: blur(5px);
        }

        .logo-text {
            font-family: 'Kanit', sans-serif; font-weight: 800; font-style: italic;
            font-size: 2rem; color: #fff; text-transform: uppercase; letter-spacing: -1px;
        }
        .logo-text span { color: var(--accent-purple); }

        .back-btn {
            padding: 0.5rem 1.5rem; border: 1px solid var(--accent-red); color: #fff;
            text-decoration: none; font-family: 'Kanit', sans-serif; text-transform: uppercase;
            font-weight: 600; background: rgba(0,0,0,0.5); transition: 0.3s;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        .back-btn:hover { background: var(--accent-red); box-shadow: 0 0 15px var(--accent-red); }

        /* --- LOGIN AREA (Fondo Restaurado y Padding Arreglado) --- */
        .login-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            /* FIX: Añadido padding superior suficiente para librar el header fijo */
            padding-top: 140px; 
            padding-bottom: 50px; /* Un poco de aire abajo también */
            /* FONDO RESTAURADO */
            background: radial-gradient(circle at center, rgba(138,43,226,0.15) 0%, #0a0a0a 80%), 
                        url('header.png') center/cover no-repeat;
        }

        /* Overlay para oscurecer */
        .login-wrapper::before {
            content: ''; position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(10, 10, 10, 0.6); z-index: 0;
        }

        .glass-login {
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 4rem 3rem;
            width: 100%; max-width: 480px;
            backdrop-filter: blur(20px);
            position: relative; z-index: 10;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            /* Decoración de esquina */
            border-bottom: 3px solid var(--accent-red);
            opacity: 0; transform: translateY(50px);
            animation: hudEntry 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 0.5s;
        }

        @keyframes hudEntry { to { opacity: 1; transform: translateY(0); } }

        /* TÍTULO ARREGLADO (Aberración Cromática limpia) */
        .login-title {
            font-family: 'Kanit', sans-serif; font-size: 3rem; text-align: center;
            text-transform: uppercase; margin-bottom: 3rem; color: #fff;
            font-style: italic;
        }
        
        .login-title span { 
            color: var(--accent-red);
            position: relative;
            display: inline-block;
            /* Efecto de temblor y separación de color */
            animation: chromaticMove 3s infinite;
            text-shadow: 2px 0 0 rgba(255,0,0,0.7), -2px 0 0 rgba(0,0,255,0.7);
        }

        @keyframes chromaticMove {
            0% { text-shadow: 2px 0 0 rgba(255,0,0,0.7), -2px 0 0 rgba(0,0,255,0.7); transform: translate(0); }
            2% { text-shadow: 2px 0 0 rgba(255,0,0,0.7), -2px 0 0 rgba(0,0,255,0.7); transform: translate(-2px, 1px); }
            4% { text-shadow: 2px 0 0 rgba(255,0,0,0.7), -2px 0 0 rgba(0,0,255,0.7); transform: translate(0); }
            /* Pausa larga para que no sea molesto */
            100% { text-shadow: 2px 0 0 rgba(255,0,0,0.7), -2px 0 0 rgba(0,0,255,0.7); transform: translate(0); }
        }

        .form-group { margin-bottom: 2rem; }

        .form-label {
            display: block; margin-bottom: 0.8rem; font-family: 'Kanit', sans-serif;
            font-size: 1rem; color: var(--accent-purple); text-transform: uppercase;
            letter-spacing: 2px; font-weight: 600;
        }

        .input-group-inner { position: relative; width: 100%; }

        .form-input {
            width: 100%; padding: 1.2rem 1.2rem; padding-right: 3rem;
            background: rgba(0, 0, 0, 0.4); border: 2px solid #333; color: #fff;
            font-family: 'Montserrat', sans-serif; font-size: 1.1rem;
            transition: all 0.1s ease; /* Transición rápida para el temblor */
            clip-path: polygon(0 0, 100% 0, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        }

        .form-input:focus {
            outline: none; border-color: var(--accent-red);
            background: rgba(20, 0, 20, 0.6);
            box-shadow: 0 0 20px rgba(221, 0, 255, 0.3);
        }

        /* CLASE PARA LA VIBRACIÓN AL ESCRIBIR */
        .form-input.vibrating {
            animation: inputShake 0.2s linear infinite;
            border-color: #fff !important; /* Destello blanco al vibrar */
        }

        @keyframes inputShake {
            0% { transform: translate(0px, 0px); }
            25% { transform: translate(2px, -2px); }
            50% { transform: translate(-2px, 2px); }
            75% { transform: translate(2px, 2px); }
            100% { transform: translate(-2px, -2px); }
        }

        .input-icon {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            color: #555; font-size: 1.2rem; pointer-events: none; transition: 0.3s;
        }
        .form-input:focus + .input-icon { color: var(--accent-red); text-shadow: 0 0 10px var(--accent-red); }

        .submit-btn {
            width: 100%; padding: 1.5rem; margin-top: 1rem;
            background: var(--text-main); color: #000; border: none;
            font-family: 'Kanit', sans-serif; text-transform: uppercase;
            font-size: 1.5rem; font-weight: 900; font-style: italic; cursor: pointer;
            position: relative; overflow: hidden;
            clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
            transition: 0.3s;
        }
        .submit-btn:hover {
            background: var(--accent-red); color: #fff;
            box-shadow: 0 0 30px var(--accent-red);
            transform: scale(1.02);
        }

        /* --- PARTÍCULAS DE EXPLOSIÓN --- */
        .particle {
            position: absolute;
            pointer-events: none;
            width: 6px; height: 6px;
            border-radius: 50%;
            /* La animación se define en el JS mediante variables CSS */
            animation: particleExplosion 0.8s ease-out forwards;
            z-index: 1000;
        }

        @keyframes particleExplosion {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
                box-shadow: 0 0 10px currentColor;
            }
            100% {
                opacity: 0;
                /* Las variables --tx y --ty se setean en JS */
                transform: translate(var(--tx), var(--ty)) scale(0); 
            }
        }

        /* --- FOOTER RESTAURADO --- */
        footer {
            background: #050505;
            padding: 3rem;
            text-align: center;
            border-top: 1px solid #222;
            z-index: 10; /* Asegurar que esté sobre el fondo */
        }

        .social-links { margin: 2rem 0; }
        .social-links a {
            color: var(--text-muted);
            font-size: 1.8rem;
            margin: 0 1rem;
            transition: all 0.3s;
        }
        .social-links a:hover { color: var(--accent-red); transform: translateY(-3px); }

        .footer-links {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin: 0 1rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }
        .footer-links a:hover { color: #fff; text-decoration: underline; }

        @media (max-width: 768px) {
            .glass-login { padding: 2rem; max-width: 90%; }
            .login-title { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div id="preloader">
        <div class="loader-circle"></div>
        <div class="loader-text">Espera...</div>
    </div>

    <header id="header">
        <div class="logo-text">VINTARA<span>.</span></div>
        <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> Volver</a>
    </header>

    <div class="login-wrapper">
        <div class="glass-login">
            <div style="position: absolute; top: 15px; left: 20px; color: #555; font-family: 'Kanit'; font-size: 0.7rem; letter-spacing: 2px;">/// SECURE_ACCESS_TERMINAL ///</div>

            <h2 class="login-title">Acceso <span>Seguro</span></h2>
            
            <form action="/404" method="POST">
                
                <div class="form-group">
                    <label class="form-label" for="username">Usuario</label>
                    <div class="input-group-inner">
                        <input type="text" id="username" name="username" class="form-input trigger-explosion" placeholder="Introduce tu ID" required autocomplete="off">
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <div class="input-group-inner">
                         <input type="password" id="password" name="password" class="form-input trigger-explosion" placeholder="Introduce tu clave" required>
                        <i class="fas fa-lock input-icon"></i>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    CONECTAR
                </button>

            </form>
        </div>
    </div>

    <footer>
        <p style="opacity: 0.5;">© 2026 Vintara Logistics. Design by Vintara Studio.</p>
        <div class="social-links">
            <a href="https://www.tiktok.com/@chapulinesvtc" target="_blank"><i class="fab fa-tiktok"></i></a>
            <a href="https://discord.gg/UY42pmqvnw" target="_blank"><i class="fab fa-discord"></i></a>
            <a href="https://www.youtube.com/@chapulinesvtc" target="_blank"><i class="fab fa-youtube"></i></a>
        </div>
        <div class="footer-links">
            <a href="/terminos">Términos de servicio</a>
            <a href="/politicas">Política de privacidad</a>
        </div>
    </footer>

    <script>
        // --- 1. PRELOADER ---
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('preloader').classList.add('hide-loader');
            }, 800);
        });

        // --- 2. SISTEMA DE EXPLOSIÓN AL ESCRIBIR ---
        const explosionInputs = document.querySelectorAll('.trigger-explosion');
        const colors = ['#8A2BE2', '#dd00ff', '#ffffff']; // Morado, Rosa Neón, Blanco

        explosionInputs.forEach(input => {
            input.addEventListener('input', (e) => {
                // A) Vibración del Input
                input.classList.add('vibrating');
                // Quitar la clase después de 200ms para que pueda volver a vibrar
                setTimeout(() => input.classList.remove('vibrating'), 200);

                // B) Generar Explosión de Partículas
                spawnParticles(input);
            });
        });

        function spawnParticles(targetElement) {
            // Obtener el centro del input para que la explosión salga de ahí
            const rect = targetElement.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2 + window.scrollY; // Ajuste por si hay scroll

            // Crear 12 partículas por pulsación
            for (let i = 0; i < 12; i++) {
                createParticle(centerX, centerY);
            }
        }

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            document.body.appendChild(particle);

            // Color aleatorio de nuestra paleta
            const color = colors[Math.floor(Math.random() * colors.length)];
            particle.style.backgroundColor = color;
            particle.style.color = color; // Para el box-shadow

            // Posición inicial (centro del input)
            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;

            // Dirección y distancia aleatoria para la explosión
            // Ángulo aleatorio en 360 grados (en radianes)
            const angle = Math.random() * Math.PI * 2;
            // Velocidad/Distancia variable entre 60px y 150px
            const velocity = 60 + Math.random() * 90; 
            
            // Calcular destino final usando trigonometría
            const tx = Math.cos(angle) * velocity;
            const ty = Math.sin(angle) * velocity;

            // Pasar las variables CSS a la animación
            particle.style.setProperty('--tx', `${tx}px`);
            particle.style.setProperty('--ty', `${ty}px`);

            // Limpieza: eliminar el elemento del DOM cuando termine la animación
            particle.addEventListener('animationend', () => {
                particle.remove();
            });
        }
    </script>
</body>
</html>
